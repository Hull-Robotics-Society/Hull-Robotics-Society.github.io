name: Check pull request

# Runs the content check and a full build on every pull request, so problems show up
# before anyone reviews or merges. It publishes nothing.
on:
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        name: Content check and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run build
              env:
                  # Lets the build list STL files on GitHub without hitting the anonymous rate limit
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
