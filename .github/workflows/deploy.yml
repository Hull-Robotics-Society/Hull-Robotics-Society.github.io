name: Deploy website

on:
    push:
        branches: [gh-pages]
    # Rebuild every morning so upcoming events move to "past" on their own
    schedule:
        - cron: '0 5 * * *'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: withastro/action@v6
              with:
                  node-version: 24
              env:
                  # Lets the build list STL files on GitHub without hitting the anonymous rate limit
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
